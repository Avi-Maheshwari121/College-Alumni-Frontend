name: Frontend CI Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  # JOB 1: LINTING (Runs immediately)
  lint:
    name: Code Quality (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

  # JOB 2: TESTING (Runs immediately, parallel to Linting)
  test:
    name: Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests with Coverage
        run: npm run test -- --coverage

      # ADVANCED DEVOPS: Save the coverage report so the next server can use it
      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/

  # JOB 2.5: FUNCTIONAL/E2E TESTING (Waits for Lint & Unit Tests to finish)
  e2e-test:
    name: Functional Tests (Playwright)
    needs: [lint, test] # Makes it a distinct, sequential phase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        run: npm run test:e2e

      # Save test results (traces/screenshots on failure) as an artifact
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # JOB 3: SECURITY & SAST (Waits for Lint, Test, & E2E to finish)
  sonarcloud:
    name: Security Scan (SonarCloud)
    needs: [lint, test, e2e-test] # This tells GitHub NOT to run this until the other three pass
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # SonarCloud requires full git history

      # ADVANCED DEVOPS: Download the coverage report from the Test server
      - name: Download Coverage Artifact
        uses: actions/download-artifact@v4
        with:
          name: vitest-coverage
          path: coverage/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}